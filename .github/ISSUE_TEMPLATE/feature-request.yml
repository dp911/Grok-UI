name: Feature request
description: Propose a focused improvement to the local Grok command center.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result, not only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Do not include real prompts, source code, credentials, names, paths, or IP addresses.
